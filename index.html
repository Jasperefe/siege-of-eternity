<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Siege of Eternity</title>
<meta name="description" content="Hold the castle against endless waves of undead, demons and dragons. A 3D medieval wave-survival action game.">
<script>window.SOE_PLATFORM = 'local'; window.SOE_DEV = false;</script>
<link rel="stylesheet" href="./style.css?v=202611131113">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="darkveil"></div>
  <div id="hurt"></div>
  <div id="numbers"></div>
  <div id="plates"></div>

  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div id="wrath"><div id="wrath-fill"></div></div>
      <div id="dodges"></div>
    </div>
    <div id="hud-mid"><div id="wave-label"><span id="wave-word">WAVE</span> <b id="wave-n">1</b></div><div id="wave-sub"></div></div>
    <div id="hud-right"><div id="score">0</div><button id="pause-btn" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div>
    <div id="streak"></div>
  </div>
  <div id="bossbar" class="hidden"><div id="boss-name"></div><div id="boss-track"><div id="boss-fill"></div></div><div id="boss-title"></div></div>

  <div id="touch" class="hidden">
    <div id="stick-zone"></div>
    <div id="stick-base"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button id="btn-attack" class="tb big">⚔️</button>
      <button id="btn-block" class="tb">🛡️</button>
      <button id="btn-dodge" class="tb">💨</button>
      <button id="btn-wrath" class="tb">🔥</button>
    </div>
  </div>

  <div id="announce"></div>
  <div id="toasts"></div>
  <div id="screens"></div>
  <div id="ad-overlay" class="hidden"></div>
  <div id="busy" class="hidden"><div class="spin"></div><span id="busy-text">Preparing the battlefield…</span></div>
  <div id="ad-wait" class="hidden"><div class="spin"></div></div>

  <div id="loading">
    <div class="load-inner">
      <svg class="load-crest" viewBox="0 0 120 140" aria-hidden="true"><path d="M60 6 106 20v44c0 34-22 56-46 70C36 120 14 98 14 64V20L60 6Z" fill="#5e1418" stroke="#d4a548" stroke-width="5"/><g stroke="#d4a548" stroke-width="6" stroke-linecap="round"><path d="M38 102 82 42M82 102 38 42"/></g><circle cx="60" cy="72" r="9" fill="#d4a548"/></svg>
      <div class="logo"><span class="l1">Siege</span><span class="l2">of Eternity</span></div>
      <div id="load-bar"><div id="load-bar-fill"></div></div>
      <div id="load-text">Loading the siege…</div>
    </div>
  </div>
</div>
<script type="module" src="./js/main.js?v=202611131113"></script>
</body>
</html>
